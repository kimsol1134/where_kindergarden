minimumXcodeGenVersion: 2.44.1
name: WhereKindergartenNative
options:
  createIntermediateGroups: true
  preGenCommand: |
    if [ -d "WhereKindergartenNative.xcodeproj" ]; then
      rm -rf "WhereKindergartenNative.xcodeproj"
    fi
fileGroups:
  - Config
  - Scripts
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: D48DDX5D5W
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "2.2.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: ../NativeApp/Config/NativeAppInfo.plist
    CODE_SIGN_ENTITLEMENTS: ../NativeApp/Config/NativeApp.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.solkim.kindergarden
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  NativeApp:
    path: ../NativeApp
targets:
  WhereKindergartenNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/WhereKindergartenNative.xcconfig
      Release: Config/WhereKindergartenNative.xcconfig
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: ../App/App/Assets.xcassets
        buildPhase: resources
      - path: ../../public/data/kindergartens.json
        group: Resources/Data
        buildPhase: resources
      - path: ../../public/data/reviews.json
        group: Resources/Data
        buildPhase: resources
      - path: ../../public/data/vacancy.json
        group: Resources/Data
        buildPhase: resources
    dependencies:
      - package: NativeApp
        product: AppShell
    postBuildScripts:
      - name: Inject Kakao Keys
        path: Scripts/inject_kakao_keys.sh
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: WhereKindergartenNative
        PRODUCT_MODULE_NAME: WhereKindergartenNative
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1
schemes:
  WhereKindergartenNative:
    build:
      targets:
        WhereKindergartenNative: all
    run:
      config: Debug
    archive:
      config: Release
