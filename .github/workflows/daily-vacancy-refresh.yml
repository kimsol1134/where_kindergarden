name: Daily Vacancy Refresh

on:
  workflow_dispatch:
  schedule:
    # 07:40 KST daily (GitHub Actions cron uses UTC)
    - cron: '40 22 * * *'

permissions:
  contents: write

concurrency:
  group: public-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect live vacancy data
        run: pnpm sync:vacancy

      - name: Validate all public data and refresh manifest
        run: pnpm validate:data -- --write-manifest

      - name: Type-check data consumers
        run: pnpm type-check

      - name: Commit validated data changes
        id: commit
        shell: bash
        run: |
          git add -- public/data/vacancy.json public/data/freshness.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "where-kindergarten-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh live vacancy snapshot"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify production data publication
        id: publication
        if: steps.commit.outputs.changed == 'true'
        run: pnpm verify:data:production

      - name: Write refresh summary
        if: always()
        shell: bash
        run: |
          echo "## Daily vacancy refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f public/data/vacancy.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('public/data/vacancy.json', 'utf8'));
          const quality = data.quality ?? {};
          console.log(`- version: ${data.version}`);
          console.log(`- institutions: ${data.totalCount}`);
          console.log(`- positive vacancy: ${data.positiveCount}`);
          console.log(`- regions: ${quality.regionsSucceeded}/${quality.regionsRequested}`);
          console.log(`- detail coverage: ${((quality.detailCoverage ?? 0) * 100).toFixed(2)}%`);
          NODE
          fi
          echo "- committed: ${{ steps.commit.outputs.changed || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production publication: ${{ steps.publication.outcome || 'not required' }}" >> "$GITHUB_STEP_SUMMARY"
